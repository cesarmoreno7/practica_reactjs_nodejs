name: Playwright E2E

on:
  push:
    branches: [ main, master, develop, qa ]
  pull_request:
    branches: [ main, master, develop, qa ]
  workflow_dispatch:

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests and step report
        run: npm run test:e2e:full

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/html
          if-no-files-found: warn

      - name: Upload Playwright step-by-step report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-step-report
          path: playwright-report/paso-a-paso.md
          if-no-files-found: warn

      - name: Upload Playwright raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: warn
