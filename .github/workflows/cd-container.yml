name: CD Container

on:
  push:
    branches: [ qa, preprod, main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=qa,enable=${{ github.ref_name == 'qa' }}
            type=raw,value=preprod,enable=${{ github.ref_name == 'preprod' }}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy (qa)
        if: github.ref_name == 'qa'
        env:
          RENDER_DEPLOY_HOOK_QA: ${{ secrets.RENDER_DEPLOY_HOOK_QA }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_QA" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_QA"
          else
            echo "Secret RENDER_DEPLOY_HOOK_QA no configurado; se omite deploy automático."
          fi

      - name: Trigger Render deploy (preprod)
        if: github.ref_name == 'preprod'
        env:
          RENDER_DEPLOY_HOOK_PREPROD: ${{ secrets.RENDER_DEPLOY_HOOK_PREPROD }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_PREPROD" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_PREPROD"
          else
            echo "Secret RENDER_DEPLOY_HOOK_PREPROD no configurado; se omite deploy automático."
          fi

      - name: Trigger Render deploy (main)
        if: github.ref_name == 'main'
        env:
          RENDER_DEPLOY_HOOK_MAIN: ${{ secrets.RENDER_DEPLOY_HOOK_MAIN }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_MAIN" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_MAIN"
          else
            echo "Secret RENDER_DEPLOY_HOOK_MAIN no configurado; se omite deploy automático."
          fi
